<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entroly Offline</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7f4 0%, #b2ebf2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #00695c;
            overflow: hidden;
            position: relative;
        }

        /* Animated background elements */
        .bg-bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-bubbles li {
            position: absolute;
            list-style: none;
            display: block;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.15);
            bottom: -160px;
            border-radius: 50%;
            animation: square 25s infinite;
            transition-timing-function: linear;
        }

        .bg-bubbles li:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
            width: 80px;
            height: 80px;
        }

        .bg-bubbles li:nth-child(2) {
            left: 20%;
            animation-delay: 2s;
            animation-duration: 17s;
        }

        .bg-bubbles li:nth-child(3) {
            left: 25%;
            animation-delay: 4s;
        }

        .bg-bubbles li:nth-child(4) {
            left: 40%;
            animation-delay: 0s;
            animation-duration: 22s;
            width: 60px;
            height: 60px;
        }

        .bg-bubbles li:nth-child(5) {
            left: 70%;
            animation-delay: 3s;
        }

        .bg-bubbles li:nth-child(6) {
            left: 80%;
            animation-delay: 2s;
            width: 120px;
            height: 120px;
        }

        .bg-bubbles li:nth-child(7) {
            left: 32%;
            animation-delay: 6s;
            width: 100px;
            height: 100px;
        }

        .bg-bubbles li:nth-child(8) {
            left: 55%;
            animation-delay: 8s;
            animation-duration: 18s;
        }

        .bg-bubbles li:nth-child(9) {
            left: 25%;
            animation-delay: 9s;
            animation-duration: 20s;
            width: 50px;
            height: 50px;
        }

        .bg-bubbles li:nth-child(10) {
            left: 90%;
            animation-delay: 11s;
            width: 70px;
            height: 70px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 30px rgba(0, 105, 92, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            animation: fadeIn 1s ease-out;
            backdrop-filter: blur(5px);
        }

        .icon-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
        }

        .icon-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(178, 235, 242, 0.3);
            animation: pulse 2s infinite;
        }

        .icon {
            position: relative;
            font-size: 60px;
            line-height: 120px;
            color: #00695c;
            z-index: 2;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 600;
            animation: slideIn 0.8s ease-out;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            animation: slideIn 1s ease-out;
        }

        .retry-btn {
            background: linear-gradient(to right, #00695c, #00897b);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 105, 92, 0.3);
            animation: fadeIn 1.2s ease-out;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .retry-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 105, 92, 0.4);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        .connection-status {
            margin-top: 20px;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            animation: fadeIn 1.5s ease-out;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff6b6b;
            animation: blink 1.5s infinite;
        }

        /* Animations */
        @keyframes pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.3;
            }
            100% {
                transform: scale(0.95);
                opacity: 0.7;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes square {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.5;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* Responsive design */
        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 15px;
            }

            .icon-container {
                width: 100px;
                height: 100px;
            }

            .icon {
                font-size: 50px;
                line-height: 100px;
            }
        }
    </style>
</head>
<body>
<ul class="bg-bubbles">
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
</ul>

<div class="container">
    <div class="icon-container">
        <div class="icon-circle"></div>
        <div class="icon">
            <i class="fas fa-wifi"></i>
        </div>
    </div>

    <h1>You're Offline</h1>
    <p>Entroly is unable to connect to the internet. Please check your connection and try again.</p>

    <button class="retry-btn" onclick="window.location.reload()">
        <i class="fas fa-redo"></i> Try Again
    </button>

    <div class="connection-status">
        <div class="status-dot"></div>
        <span>Waiting for connection...</span>
    </div>
</div>

<script>
    // Function to check connection status
    function checkConnection() {
        if (navigator.onLine) {
            // If online, reload the page
            window.location.reload();
        }
    }

    // Check connection status every 3 seconds
    setInterval(checkConnection, 3000);

    // Also check when the user clicks the retry button
    document.querySelector('.retry-btn').addEventListener('click', checkConnection);
</script>
</body>
</html>
